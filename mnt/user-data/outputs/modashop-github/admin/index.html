<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | ModaShop Tarragona</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<header class="hd"><div class="wrap hd-in">
  <a class="logo" href="../" aria-label="Ir a la tienda"><b>MODASHOP</b><span>TARRAGONA</span></a>
  <div class="tools"><b class="adm">ADMIN</b><button class="ico" id="out" type="button" hidden>SALIR</button></div>
</div></header>
<main class="wrap sec" id="ad"></main>
<dialog id="dg" aria-labelledby="dq">
  <p id="dq">¿Seguro que quieres eliminar este producto?</p>
  <div class="bt"><button class="btn" id="no" type="button">CANCELAR</button><button class="btn p" id="yes" type="button">ELIMINAR</button></div>
</dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script src="../js/config.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
